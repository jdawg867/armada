name: Pixel 5a official Android 12L AOSP source probe

on:
  pull_request:
    branches: [development]
    paths:
      - "research/pixel5a-modemsmem/probe_aosp_12l_sources.py"
      - "tests/pixel5a-aosp-12l-source-probe-test.py"
      - "research/pixel5a-modemsmem/compare_aosp_lineage_12l.py"
      - "tests/pixel5a-aosp-lineage-comparison-test.py"
      - "research/pixel5a-modemsmem/inspect_aosp_lineage_12l_diffs.py"
      - "tests/pixel5a-aosp-lineage-source-diff-test.py"
      - "research/pixel5a-modemsmem/project_lineage_module_load.py"
      - "tests/pixel5a-lineage-module-projection-test.py"
      - ".github/workflows/pixel5a-aosp-12l-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source probe contracts offline
        run: python3 tests/pixel5a-aosp-12l-source-probe-test.py
      - name: Verify source-only Lineage 329-module first-stage projection evidence
        shell: bash
        run: python3 tests/pixel5a-lineage-first-stage-evidence-test.py

      - name: Verify downstream PIL subsystem start-trigger source evidence
        shell: bash
        run: python3 tests/pixel5a-downstream-pil-start-trigger-test.py

      - name: Validate pinned Lito PIL modem DT and conditional subsystem caller
        shell: bash
        run: python3 tests/pixel5a-lito-modem-pil-dt-caller-test.py

      - name: Verify Lito ADSP source selection and unproven modem branch
        shell: bash
        run: python3 tests/pixel5a-adsp-modem-loader-config-test.py

      - name: Verify Barbet DT include graph and indirect modem caller source boundaries
        shell: bash
        run: python3 tests/pixel5a-barbet-dt-indirect-modem-caller-test.py

      - name: Verify IPA default subsystem names and Barbet MP overlay source mapping
        shell: bash
        run: python3 tests/pixel5a-ipa-subsystem-name-barbet-overlay-test.py

      - name: Verify IPA DT firmware-name override provenance and defaults
        shell: bash
        run: python3 tests/pixel5a-ipa-firmware-name-property-provenance-test.py

      - name: Verify pinned Lito IPA source node and non-modem firmware defaults
        shell: bash
        run: python3 tests/pixel5a-lito-ipa-node-source-test.py

      - name: Validate pinned Lito modem PIL binding and absent SMEM readiness fence
        shell: bash
        run: python3 tests/pixel5a-lito-modem-pil-binding-test.py

      - name: Audit pinned modemsmem item134 reset and missing firmware start barrier
        shell: bash
        run: python3 tests/pixel5a-modemsmem-publication-first-request-test.py

      - name: Verify SMEM allocator metadata barriers are not item134 payload readiness
        shell: bash
        run: python3 tests/pixel5a-smem-allocator-ownership-ordering-test.py

      - name: Verify source-only SMEM provider deferral and fail-closed publication contract
        shell: bash
        run: python3 tests/pixel5a-smem-provider-publication-contract-test.py

      - name: Check offline-only modem publication fail-closed state machine
        shell: bash
        run: python3 tests/pixel5a-modem-publication-state-model-test.py

      - name: Guard pinned Android Peripheral Manager first-start and non-destructive SMEM policy
        shell: bash
        run: python3 tests/pixel5a-android-peripheral-manager-first-start-test.py

      - name: Check pinned Android init Peripheral Manager event edges and readiness gaps
        shell: bash
        run: python3 tests/pixel5a-android-init-modem-start-event-graph-test.py

      - name: Verify pinned modem SSR character device startup and permission boundaries
        shell: bash
        run: python3 tests/pixel5a-modem-subsys-char-device-first-start-test.py

      - name: Verify pinned modem SSR ueventd DAC and SELinux evidence boundaries
        shell: bash
        run: python3 tests/pixel5a-modem-ssr-device-access-test.py

      - name: Check pinned Peripheral Manager init identity and modem SSR access eligibility
        shell: bash
        run: python3 tests/pixel5a-peripheral-manager-init-identity-test.py

      - name: Guard bounded public Peripheral Manager and subsystem SSR source conclusions
        shell: bash
        run: python3 tests/pixel5a-peripheral-manager-public-interface-test.py

      - name: Guard pinned SSR device open-close and reference lifecycle semantics
        shell: bash
        run: python3 tests/pixel5a-modem-ssr-get-put-lifecycle-test.py

      - name: Guard pinned SSR start stop and failure unwinding evidence
        shell: bash
        run: python3 tests/pixel5a-modem-ssr-start-stop-failure-test.py

      - name: Guard pinned Lito PIL callback and loader failure rollback evidence
        shell: bash
        run: python3 tests/pixel5a-modem-pil-callback-rollback-test.py

      - name: Guard Step 816 pinned PAS SCM shutdown error and resource ownership boundaries
        shell: bash
        run: python3 tests/pixel5a-modem-pas-shutdown-resource-test.py

      - name: Guard pinned PIL regulator clock and proxy bus vote failure semantics
        shell: bash
        run: python3 tests/pixel5a-pil-regulator-clock-proxy-vote-test.py

      - name: Guard pinned PIL proxy vote failure edge and missing unvote
        shell: bash
        run: python3 tests/pixel5a-pil-proxy-vote-error-edge-test.py

      - name: Guard pinned Redbull bus config and Lito modem bus source selection
        shell: bash
        run: python3 tests/pixel5a-pil-modem-bus-scaling-source-selection-test.py

      - name: Guard pinned Barbet MP modem bus DT and module-list projection
        shell: bash
        run: python3 tests/pixel5a-barbet-modem-bus-overlay-module-order-test.py

      - name: Guard Step 821 Barbet MP and modprobe dependency source boundaries
        shell: bash
        run: python3 tests/pixel5a-barbet-mp-modprobe-dependency-boundary-test.py

      - name: Guard Step 822 source-hash CI recheck and Kbuild dependency evidence limits
        shell: bash
        run: python3 tests/pixel5a-source-hash-and-modules-dependency-boundary-test.py

      - name: Fetch public, exactly tagged AOSP text sources only
        shell: bash
        run: |
          set -euo pipefail
          python3 research/pixel5a-modemsmem/probe_aosp_12l_sources.py \
            --online --output "$RUNNER_TEMP/pixel5a-aosp-12l-source-probe.json" \
            > "$RUNNER_TEMP/pixel5a-aosp-12l-source-probe.log"
          python3 - "$RUNNER_TEMP/pixel5a-aosp-12l-source-probe.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report["stock_vendor_boot_verified"] is False
          assert report["hardware_tested"] is False
          assert len(report["entries"]) == 18
          print("SOURCE_RETRIEVED",report["retrieved_count"])
          print("SOURCE_UNAVAILABLE",report["unavailable_count"])
          print("ALL_SOURCE_FILES_RETRIEVED",report["all_files_retrieved"])
          for entry in report["entries"]:
              print(entry["tag"],entry["repository"],entry["path"],
                    entry["state"],entry.get("sha256","NOT_FETCHED"),
                    entry.get("http_status",""))
          print("STOCK_VENDOR_BOOT_VERIFIED=false")
          PY
      - name: Compare exact AOSP tags to pinned LineageOS text (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/pixel5a-aosp-lineage-comparison-test.py
          python3 research/pixel5a-modemsmem/compare_aosp_lineage_12l.py \
            --online --output "$RUNNER_TEMP/pixel5a-aosp-lineage-12l-comparison.json" \
            > "$RUNNER_TEMP/pixel5a-aosp-lineage-12l-comparison.log"
          python3 - "$RUNNER_TEMP/pixel5a-aosp-lineage-12l-comparison.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["stock_vendor_boot_verified"] is False
          assert r["effective_modem_boot_order_verified"] is False
          assert len(r["entries"]) == 15
          print("SOURCE_PAIRS_COMPARED",r["compared_count"])
          print("SOURCE_PAIRS_UNAVAILABLE",r["unavailable_count"])
          for e in r["entries"]:
              print("COMPARE",e["tag"],e["device"],e["path"],e["compare_state"],
                    e.get("identical_bytes","UNAVAILABLE"),
                    e.get("aosp_sha256","NO_AOSP_SHA"),
                    e.get("lineage_sha256","NO_LINEAGE_SHA"),
                    e.get("hunks_changed","UNKNOWN"))
          print("STOCK_VENDOR_BOOT_VERIFIED=false")
          PY
      - name: Inspect source diff hunks for three AOSP versus Lineage paths
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/pixel5a-aosp-lineage-source-diff-test.py
          python3 research/pixel5a-modemsmem/inspect_aosp_lineage_12l_diffs.py \
            --online --output "$RUNNER_TEMP/pixel5a-aosp-lineage-source-diffs.json" \
            > "$RUNNER_TEMP/pixel5a-aosp-lineage-source-diffs.log"
          cat "$RUNNER_TEMP/pixel5a-aosp-lineage-source-diffs.log"
          python3 - "$RUNNER_TEMP/pixel5a-aosp-lineage-source-diffs.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["retrieved_count"] == 3 and d["all_diffs_available"]
          assert not d["stock_vendor_boot_verified"]
          assert not d["modem_boot_order_verified"]
          expected={
            "barbet/barbet/init.barbet.rc":("78a14c15c8c71b5d40c712009711636bbd8505e85419cfec92ec4e15e9bbef4e","080e04c5474e2663cfe056062f08935dcb644f077a8680e867f4164772b66000"),
            "redbull/BoardConfig-common.mk":("27a623d774cb7818a892d340c9a36aee732f69f4d482b0a73fdf30757fbf5ff3","028dd8dcff8f6f306ab2a09e41617c48ba2c2539c0cbb197861204af3090e581"),
            "redbull/init.hardware.rc":("5cf98b4bab2359a81f5ddf3b10db397f9ff0361ad850733226cc7ed30f21f294","aa992f1b8481afed9ab20de181b76999b03da8910ae394f9795b34b44d81c8bf"),
          }
          for row in d["files"]:
              a,b=expected[row["device"]+"/"+row["path"]]
              if row["aosp_sha256"] != a or row["lineage_sha256"] != b:
                  print("PINNED_SOURCE_DIFF_SHA_MISMATCH",row["device"],row["path"],
                        "aosp_expected",a,"aosp_actual",row["aosp_sha256"],
                        "lineage_expected",b,"lineage_actual",row["lineage_sha256"])
              assert row["aosp_sha256"]==a and row["lineage_sha256"]==b
          print("PINNED_SOURCE_DIFFS=PASS")
          PY
      - name: Save source diff metadata (public text only)
        uses: actions/upload-artifact@v4
        with:
          name: pixel5a-aosp-lineage-12l-source-diff
          path: ${{ runner.temp }}/pixel5a-aosp-lineage-source-diffs.json
          if-no-files-found: error
          retention-days: 14
      - name: Save compare metadata (no source content or firmware)
        uses: actions/upload-artifact@v4
        with:
          name: pixel5a-aosp-lineage-12l-comparison-metadata
          path: ${{ runner.temp }}/pixel5a-aosp-lineage-12l-comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Project pinned Lineage first-stage module list and inspect PIL source
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/pixel5a-lineage-module-projection-test.py
          python3 research/pixel5a-modemsmem/project_lineage_module_load.py \
            --online --output "$RUNNER_TEMP/pixel5a-lineage-module-projection.json" \
            > "$RUNNER_TEMP/pixel5a-lineage-module-projection.log"
          python3 - "$RUNNER_TEMP/pixel5a-lineage-module-projection.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert not r["missing_watched"]
          assert r["pil_appears_before_modemsmem_in_list"]
          assert all(r["watched"][n]["in_effective_boot_projection"] for n in
                     ("smem.ko","subsys-pil-tz.ko","modemsmem.ko"))
          assert r["module_loader_checks_modprobe_status"] is False
          assert r["pil_powerup_calls_pil_boot"]
          assert r["pil_probe_registers_subsystem"]
          assert not r["actual_stock_vendor_boot_verified"]
          assert not r["module_probe_completion_verified"]
          assert not r["actual_modem_start_order_verified"]
          print("SOURCE_MODULE_LIST_COUNT",r["ordered_modules_count"])
          print("FIRST_STAGE_PROJECTION_COUNT",r["boot_projection_count"])
          print("VENDOR_PROJECTION_COUNT",r["vendor_projection_count"])
          for name,value in r["watched"].items():
              print("WATCHED",name,value["ordered_index_zero_based"],
                    value["in_effective_boot_projection"])
          print("PIL_BEFORE_MODEMSMEM_IN_SOURCE_LIST=true")
          print("PROBE_COMPLETION_VERIFIED=false")
          PY
      - name: Save first-stage source projection metadata
        uses: actions/upload-artifact@v4
        with:
          name: pixel5a-lineage-module-projection-source-only
          path: ${{ runner.temp }}/pixel5a-lineage-module-projection.json
          if-no-files-found: error
          retention-days: 14
      - name: Save source-probe metadata (no source contents or firmware)
        uses: actions/upload-artifact@v4
        with:
          name: pixel5a-aosp-12l-source-metadata
          path: ${{ runner.temp }}/pixel5a-aosp-12l-source-probe.json
          if-no-files-found: error
          retention-days: 14
