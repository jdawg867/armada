name: Android phone port validation

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phone-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-test-safety:
    name: Android phone / source-only baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify baseline tests exist
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/bootimg-regen-test.sh tests/build-channel-test.sh; do
            test -f "$test"
            bash -n "$test"
          done

      - name: Pixel 5a evidence consistency (static only)
        shell: bash
        run: python3 tests/android-phone-audit-test.py

      - name: Pixel 5a phone-function readiness contract (metadata only)
        shell: bash
        run: python3 tests/pixel5a-phone-readiness-test.py

      - name: Pixel 5a pinned modem memory transcription (static only)
        shell: bash
        run: python3 tests/pixel5a-modem-memory-test.py

      - name: Pixel 5a modem dependency gate (source-only)
        shell: bash
        run: python3 tests/pixel5a-modem-dependencies-test.py

      - name: Pixel 5a Lito MPSS and IPCC reference checks (source-only)
        shell: bash
        run: python3 tests/pixel5a-lito-modem-source-test.py

      - name: Pixel 5a pinned downstream modem and SMP2P facts (metadata only)
        shell: bash
        run: python3 tests/pixel5a-barbet-modem-reference-test.py

      - name: Compile and execute isolated modemsmem payload C tests (no kernel/device)
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/pixel5a-modemsmem"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer \
             "$SRC/test_modemsmem_payload.c" -o "$RUNNER_TEMP/modemsmem-payload-test"
          "$RUNNER_TEMP/modemsmem-payload-test" | tee "$RUNNER_TEMP/modemsmem-payload-results.txt"
          test "$(grep -c '^PASS ' "$RUNNER_TEMP/modemsmem-payload-results.txt")" -eq 5

      - name: Compile isolated Socinfo and simulated SMEM staging adapter (no device)
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/pixel5a-modemsmem"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer \
             "$SRC/test_modemsmem_adapter.c" -o "$RUNNER_TEMP/modemsmem-adapter-test"
          "$RUNNER_TEMP/modemsmem-adapter-test" | tee "$RUNNER_TEMP/modemsmem-adapter-results.txt"
          test "$(grep -c '^PASS ' "$RUNNER_TEMP/modemsmem-adapter-results.txt")" -eq 9

      - name: Simulated pinned SMEM ERR_PTR and allocation tests (host mock)
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/pixel5a-modemsmem"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer \
             -I"$SRC/mock-linux" \
             "$SRC/test_kernel_smem_facade.c" -o "$RUNNER_TEMP/modemsmem-smem-facade"
          "$RUNNER_TEMP/modemsmem-smem-facade" | tee "$RUNNER_TEMP/modemsmem-smem-facade.log"
          test "$(grep -c '^PASS ' "$RUNNER_TEMP/modemsmem-smem-facade.log")" -eq 7

      - name: Simulated MPSS boot-order gate C tests (no device)
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/pixel5a-modemsmem"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer \
             "$SRC/test_modem_boot_gate.c" -o "$RUNNER_TEMP/modem-boot-order-test"
          "$RUNNER_TEMP/modem-boot-order-test" | tee "$RUNNER_TEMP/modem-boot-order-results.txt"
          test "$(grep -c '^PASS ' "$RUNNER_TEMP/modem-boot-order-results.txt")" -eq 9

      - name: Simulated modem autostart, recovery and stale epoch C tests (no device)
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/pixel5a-modemsmem"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer \
             "$SRC/test_modem_start_epoch.c" -o "$RUNNER_TEMP/modem-start-epoch-test"
          "$RUNNER_TEMP/modem-start-epoch-test" | tee "$RUNNER_TEMP/modem-start-epoch.log"
          test "$(grep -c '^PASS ' "$RUNNER_TEMP/modem-start-epoch.log")" -eq 12

      - name: Simulated modem crash recovery and removal lifecycle (host C only)
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/pixel5a-modemsmem"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer \
             "$SRC/test_modem_lifecycle_audit.c" -o "$RUNNER_TEMP/modem-lifecycle-audit"
          "$RUNNER_TEMP/modem-lifecycle-audit" | tee "$RUNNER_TEMP/modem-lifecycle-audit.log"
          test "$(grep -c '^PASS ' "$RUNNER_TEMP/modem-lifecycle-audit.log")" -eq 9

      - name: Pixel 5a kernel-facing read-only SMEM contract (static only)
        shell: bash
        run: python3 tests/pixel5a-kernel-readonly-preflight-test.py

      - name: Vendor SMEM ownership is unverified (source-only negative tests)
        shell: bash
        run: python3 tests/pixel5a-vendor-ownership-audit-test.py

      - name: Pixel 5a pinned downstream modemsmem write/lifecycle hazards (source-only)
        shell: bash
        run: python3 tests/pixel5a-downstream-modemsmem-write-audit-test.py

      - name: Pixel 5a modem publication-order evidence (source-only)
        shell: bash
        run: python3 tests/pixel5a-modem-publication-order-test.py

      - name: Pinned Pixel 5a Barbet first-stage and init module evidence (source-only)
        shell: bash
        run: python3 tests/pixel5a-barbet-module-load-evidence-test.py

      - name: Official Pixel 5a Android 12L stock-build identity (no binary inspected)
        shell: bash
        run: python3 tests/pixel5a-stock-android12l-image-evidence-test.py

      - name: Test exact Android 12L AOSP tag source probe without networking
        shell: bash
        run: python3 tests/pixel5a-aosp-12l-source-probe-test.py

      - name: Verify 15-of-18 official AOSP tagged text evidence snapshot (not stock image)
        shell: bash
        run: python3 tests/pixel5a-aosp-12l-tag-result-test.py

      - name: AOSP 12L vs pinned LineageOS text comparison offline tests
        shell: bash
        run: python3 tests/pixel5a-aosp-lineage-comparison-test.py

      - name: Verify hosted AOSP vs Lineage source comparison snapshot (not hardware)
        shell: bash
        run: python3 tests/pixel5a-aosp-lineage-result-test.py

      - name: Review AOSP-Lineage changed hunks (offline negative tests)
        shell: bash
        run: python3 tests/pixel5a-aosp-lineage-source-diff-test.py

      - name: Verified AOSP-Lineage init and module packaging diff interpretation
        shell: bash
        run: python3 tests/pixel5a-aosp-lineage-diff-interpretation-test.py

      - name: Pinned Lineage first-stage module projection offline regression tests
        shell: bash
        run: python3 tests/pixel5a-lineage-module-projection-test.py

      - name: Verify source-only Lineage 329-module first-stage projection evidence
        shell: bash
        run: python3 tests/pixel5a-lineage-first-stage-evidence-test.py

      - name: Verify downstream PIL subsystem start-trigger source evidence
        shell: bash
        run: python3 tests/pixel5a-downstream-pil-start-trigger-test.py

      - name: Validate pinned Lito PIL modem DT and conditional subsystem caller
        shell: bash
        run: python3 tests/pixel5a-lito-modem-pil-dt-caller-test.py

      - name: Verify Lito ADSP source selection and unproven modem branch
        shell: bash
        run: python3 tests/pixel5a-adsp-modem-loader-config-test.py

      - name: Verify Barbet DT include graph and indirect modem caller source boundaries
        shell: bash
        run: python3 tests/pixel5a-barbet-dt-indirect-modem-caller-test.py

      - name: Verify IPA default subsystem names and Barbet MP overlay source mapping
        shell: bash
        run: python3 tests/pixel5a-ipa-subsystem-name-barbet-overlay-test.py

      - name: Verify IPA DT firmware-name override provenance and defaults
        shell: bash
        run: python3 tests/pixel5a-ipa-firmware-name-property-provenance-test.py

      - name: Verify pinned Lito IPA source node and non-modem firmware defaults
        shell: bash
        run: python3 tests/pixel5a-lito-ipa-node-source-test.py

      - name: Validate pinned Lito modem PIL binding and absent SMEM readiness fence
        shell: bash
        run: python3 tests/pixel5a-lito-modem-pil-binding-test.py

      - name: Audit pinned modemsmem item134 reset and missing firmware start barrier
        shell: bash
        run: python3 tests/pixel5a-modemsmem-publication-first-request-test.py

      - name: Verify SMEM allocator metadata barriers are not item134 payload readiness
        shell: bash
        run: python3 tests/pixel5a-smem-allocator-ownership-ordering-test.py

      - name: Verify source-only SMEM provider deferral and fail-closed publication contract
        shell: bash
        run: python3 tests/pixel5a-smem-provider-publication-contract-test.py

      - name: Check offline-only modem publication fail-closed state machine
        shell: bash
        run: python3 tests/pixel5a-modem-publication-state-model-test.py

      - name: Guard pinned Android Peripheral Manager first-start and non-destructive SMEM policy
        shell: bash
        run: python3 tests/pixel5a-android-peripheral-manager-first-start-test.py

      - name: Check pinned Android init Peripheral Manager event edges and readiness gaps
        shell: bash
        run: python3 tests/pixel5a-android-init-modem-start-event-graph-test.py

      - name: Verify pinned modem SSR character device startup and permission boundaries
        shell: bash
        run: python3 tests/pixel5a-modem-subsys-char-device-first-start-test.py

      - name: Verify pinned modem SSR ueventd DAC and SELinux evidence boundaries
        shell: bash
        run: python3 tests/pixel5a-modem-ssr-device-access-test.py

      - name: Check pinned Peripheral Manager init identity and modem SSR access eligibility
        shell: bash
        run: python3 tests/pixel5a-peripheral-manager-init-identity-test.py

      - name: Guard bounded public Peripheral Manager and subsystem SSR source conclusions
        shell: bash
        run: python3 tests/pixel5a-peripheral-manager-public-interface-test.py

      - name: Guard pinned SSR device open-close and reference lifecycle semantics
        shell: bash
        run: python3 tests/pixel5a-modem-ssr-get-put-lifecycle-test.py

      - name: Guard pinned SSR start stop and failure unwinding evidence
        shell: bash
        run: python3 tests/pixel5a-modem-ssr-start-stop-failure-test.py

      - name: Guard pinned Lito PIL callback and loader failure rollback evidence
        shell: bash
        run: python3 tests/pixel5a-modem-pil-callback-rollback-test.py

      - name: Guard Step 816 pinned PAS SCM shutdown error and resource ownership boundaries
        shell: bash
        run: python3 tests/pixel5a-modem-pas-shutdown-resource-test.py

      - name: Guard pinned PIL regulator clock and proxy bus vote failure semantics
        shell: bash
        run: python3 tests/pixel5a-pil-regulator-clock-proxy-vote-test.py

      - name: Guard pinned PIL proxy vote failure edge and missing unvote
        shell: bash
        run: python3 tests/pixel5a-pil-proxy-vote-error-edge-test.py

      - name: SM7250 ICC index validator (synthetic fixtures only)
        shell: bash
        run: python3 tests/sm7250-icc-index-check.py --self-test

      - name: Boot image regeneration regression
        shell: bash
        run: bash tests/bootimg-regen-test.sh

      - name: Build channel safety regression
        shell: bash
        run: bash tests/build-channel-test.sh

      - name: Confirm no device or release access
        shell: bash
        run: |
          set -euo pipefail
          echo "This validation job has read-only repository permissions."
          echo "No device connected; no ADB, fastboot, firmware flashing, image publication, or SMMU/BCM activation."
